<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="content-language" content="en"><meta name="google" content="notranslate"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Photon</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --bg:#101010;
  --side:#141414;
  --btn:#1c1c1c;
  --btn2:#262626;
  --card:#181818;
  --ink:#fffaf0; /* Floral white */
  --off-white:#fdfcf8;
  --ivory:#f3f0e9;
  --nude:#e3dbcc;
  --mute:#8e897e;
  --line:rgba(227,219,204,.12);
  --p-pink:#e3dbcc;
  --p-violet:#c8bea9;
  --p-blue:#f3f0e9;
  --p-cyan:#fffaf0;
  --p-deep:#141414;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#333 transparent}
[hidden]{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#444;background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-corner{background:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#side{width:205px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 8px;gap:6px;flex-shrink:0;transition:margin .2s;z-index:6}
#side.hide{margin-left:-205px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.08em;font-size:13.5px;padding:3px 6px 10px;color:var(--ink)}
.logo img,.brand-logo-img{width:22px;height:22px;display:block;object-fit:contain;mix-blend-mode:screen;filter:brightness(1.2) contrast(1.1)}
.search-chat-btn{text-align:center}.chat-search-input{width:100%;margin:3px 0 6px;padding:8px 9px;border:1px solid rgba(227,219,204,.22);border-radius:4px;background:#111;color:var(--ink);font:inherit;font-size:12px}.chat-search-input:focus{outline:1px solid var(--cream)}
.sb{border:1px solid rgba(227,219,204,.15);background:var(--btn);color:var(--ink);border-radius:2px;padding:6px 8px;font-size:11.5px;width:100%;transition:all .2s;font-weight:500}
.sb:hover{background:var(--btn2);border-color:rgba(227,219,204,.35);box-shadow:0 2px 8px rgba(0,0,0,.5)}
#upg{background:linear-gradient(135deg,#e3dbcc 0%,#c8bea9 100%);border:0;border-radius:2px;color:#101010;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.5);transition:filter .2s,box-shadow .2s}
#upg:hover{filter:brightness(1.08);box-shadow:0 3px 14px rgba(227,219,204,.25)}
.lbl{font-size:11px;color:var(--mute);padding:10px 6px 4px;letter-spacing:.04em;text-transform:uppercase}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.ci{display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:2px;cursor:pointer;font-size:12px;color:#d5d0c5;transition:all .15s;border-left:2px solid transparent}
.ci:hover,.ci.on{background:linear-gradient(90deg,rgba(227,219,204,.12) 0%,rgba(227,219,204,.03) 100%);color:var(--ink);border-left-color:var(--nude)}
.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci button{border:0;background:none;color:var(--mute);opacity:0;padding:0 3px}
.ci:hover button{opacity:1}
#main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0;height:100%;background:radial-gradient(circle at 50% 15%,rgba(227,219,204,.04) 0%,transparent 65%),var(--bg)}
#topo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#top{position:absolute;top:12px;right:14px;display:flex;gap:8px;align-items:center;z-index:5}
#plan{background:rgba(20,20,20,.85);border:1px solid rgba(227,219,204,.2);backdrop-filter:blur(8px);padding:4px 10px;font-size:11.5px;border-radius:2px;box-shadow:0 2px 12px rgba(0,0,0,.4);color:var(--ivory)}
#plan a,.up{color:var(--nude);text-decoration:none;font-weight:600;cursor:pointer;transition:color .2s}
#plan a:hover,.up:hover{color:var(--ink);text-shadow:0 0 8px rgba(227,219,204,.5)}
#tog{width:30px;height:28px;border:1px solid rgba(227,219,204,.2);background:rgba(20,20,20,.85);backdrop-filter:blur(8px);border-radius:2px;display:grid;place-items:center;padding:0;transition:all .2s}
#tog:hover{background:rgba(35,35,35,.95);border-color:rgba(227,219,204,.35)}
#tog svg{width:16px;height:16px;stroke:var(--ivory)}
#hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}
#hero h1{font:400 clamp(24px,4vw,34px)/1.2 Georgia,"Times New Roman",serif;margin:0 0 22px;text-align:center;color:var(--ink);text-shadow:0 2px 14px rgba(0,0,0,.7)}

@keyframes prismSpin{0%{transform:scale(.95) rotate(-3deg)}50%{transform:scale(1.05) rotate(3deg)}100%{transform:scale(.95) rotate(-3deg)}}

#msgs{flex:1;overflow-y:auto;padding:58px 18px 12px;position:relative;z-index:1}
.row{display:flex;max-width:760px;width:100%;margin:0 auto 14px}
.row.u{justify-content:flex-end}
.b{padding:9px 13px;border-radius:3px;overflow-wrap:anywhere;max-width:100%}
.u .b{background:linear-gradient(135deg,rgba(227,219,204,.18) 0%,rgba(243,240,233,.08) 100%);border:1px solid rgba(227,219,204,.25);white-space:pre-wrap;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.35);color:var(--ink)}
.a .b{width:100%;padding-left:2px;color:var(--ivory)}
.b p{margin:.4em 0}.b h1,.b h2,.b h3{margin:.8em 0 .3em;font-family:Georgia,serif;font-weight:400;line-height:1.25;color:var(--ink)}.b h1{font-size:1.4em}.b h2{font-size:1.2em}.b h3{font-size:1.05em}
.b ul,.b ol{margin:.4em 0;padding-left:1.4em}
.b code{background:rgba(227,219,204,.1);border:1px solid rgba(227,219,204,.18);color:var(--off-white);padding:1px 5px;border-radius:2px;font:12.5px ui-monospace,Menlo,Consolas,monospace}
.pre{position:relative;margin:.6em 0}
.pre pre{margin:0;background:#0c0c0c;border:1px solid rgba(227,219,204,.18);border-radius:3px;padding:24px 14px 12px;overflow-x:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace}
.pre pre code{background:none;border:0;color:var(--ivory);padding:0}
.pre small{position:absolute;top:6px;left:12px;color:var(--mute);font-size:10px}
.pre button{position:absolute;top:4px;right:6px;border:1px solid rgba(227,219,204,.18);background:#1a1a1a;color:var(--ivory);border-radius:2px;font-size:10px;padding:2px 8px;transition:all .2s}
.pre button:hover{background:#2a2a2a;color:var(--ink);border-color:rgba(227,219,204,.35)}
.think{color:var(--mute);font-style:italic}.err{color:#ff7b9c}

/* CHATBOX WITH FLOWING THEME BORDER */
#comp{width:100%;max-width:540px;margin:0 auto;position:relative;z-index:2}
#main.chat #comp{margin:0 auto;padding:0 18px 16px;max-width:796px}

.box-flow-wrap{position:relative;border-radius:3px;transition:all .3s ease}
.flow-glow,.flow-beam{position:absolute;inset:-2px;border-radius:3px;pointer-events:none;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s ease}
.flow-glow{filter:blur(12px);opacity:0;z-index:0}
.flow-beam{z-index:1;padding:2px;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* When chatbox is empty / before entering anything, flow theme flows around the box */
.box-flow-wrap.flowing .flow-beam{opacity:1;visibility:visible}
.box-flow-wrap.flowing .flow-glow{opacity:.6;visibility:visible}

.flow-glow::before,.flow-beam::before{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  width:280%;
  height:500%;
  background:conic-gradient(
    from 0deg,
    #e3dbcc 0%,
    #fdfcf8 22%,
    #fffaf0 45%,
    #f3f0e9 68%,
    rgba(227,219,204,.4) 85%,
    #e3dbcc 100%
  );
  transform:translate(-50%,-50%);
  animation:flowSpin 3.8s linear infinite;
}
@keyframes flowSpin{0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(360deg)}}

#box{position:relative;z-index:2;background:rgba(22,22,22,.96);backdrop-filter:blur(12px);border-radius:2px;padding:12px 14px 10px;box-shadow:0 4px 26px rgba(0,0,0,.65);border:1px solid rgba(227,219,204,.18);transition:border-color .3s ease,box-shadow .3s ease}
#main.chat #box{border:1px solid rgba(227,219,204,.18)}
.box-flow-wrap.has-text #box{border-color:rgba(227,219,204,.35);box-shadow:0 4px 20px rgba(0,0,0,.6),0 0 12px rgba(227,219,204,.12)}

textarea{display:block;width:100%;border:0;outline:0;background:none;resize:none;color:var(--ink);font:inherit;font-size:12.5px;max-height:160px;min-height:34px;padding:0}
textarea::placeholder{color:var(--mute)}
.tools{display:flex;align-items:center;margin-top:8px;gap:12px}
.chat-file-list{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 8px}.chat-file-chip{display:inline-flex;align-items:center;gap:7px;max-width:min(290px,100%);padding:5px 8px;border:1px solid rgba(227,219,204,.2);border-radius:4px;background:#242321;color:var(--ivory);font-size:10px}.chat-file-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-file-chip small{color:var(--mute);white-space:nowrap}.chat-file-chip button{border:0;background:none;color:var(--mute);font-size:14px;line-height:1;cursor:pointer;padding:0 1px}.chat-file-chip button:hover{color:#ff9e9e}.row.u .file-attachments{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.row.u .file-attachments span{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(227,219,204,.18);border-radius:4px;padding:4px 7px;color:var(--mute);font-size:10px}
.tools .sp{flex:1}
.ib{border:0;background:none;padding:0;display:grid;place-items:center;width:20px;height:20px;color:var(--ivory);transition:color .2s}
.ib:hover{color:var(--ink)}
.ib svg{width:15px;height:15px}
.ib.plus svg{width:17px;height:17px}
.ib.rec{color:#ff5c7a}
.box-flow-wrap.has-text #go{color:var(--nude);filter:drop-shadow(0 0 6px rgba(227,219,204,.5))}
#pop{position:absolute;bottom:calc(100% + 6px);left:0;background:#181818;border:1px solid rgba(227,219,204,.2);border-radius:3px;padding:4px;display:none;min-width:205px;box-shadow:0 10px 40px rgba(0,0,0,.8);z-index:10}
#pop.on{display:block}
#pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:2px;font-size:12px;color:var(--ivory)}
#pop button:hover,#pop button.on{background:rgba(227,219,204,.15);color:var(--ink)}
#pop button.on::after{content:" ✓";color:var(--nude)}
#modeTag{font-size:10px;color:var(--nude);display:none;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1f1f1f;border:1px solid rgba(227,219,204,.25);box-shadow:0 8px 30px rgba(0,0,0,.8);color:var(--ink);padding:6px 14px;border-radius:3px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
@media(max-width:720px){#side{position:fixed;inset:0 auto 0 0;padding-top:calc(12px + env(safe-area-inset-top,0px));margin-left:-205px}#side.show{margin-left:0;box-shadow:0 0 50px rgba(0,0,0,.85)}#side.hide{margin-left:-205px}}

#ov{position:fixed;inset:0;background:rgba(10,10,10,.86);backdrop-filter:blur(6px);z-index:8;display:none;overflow:auto;padding:20px}
#ov.on{display:block}
#ov>div{margin:auto;min-height:100%;display:flex;align-items:center;justify-content:center}
#ov.profile-overlay{padding:0;background:#090909;backdrop-filter:none}
#ov.profile-overlay>div{display:block;min-height:100%;width:100%}
.card{background:#181818;border:1px solid rgba(227,219,204,.2);border-radius:4px;padding:24px;width:100%;max-width:390px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.card.wide{max-width:980px}
.card h2{font:400 22px Georgia,serif;margin:0 0 4px;color:var(--ink)}
.card p.s{color:var(--mute);margin:0 0 14px;font-size:12px}
.card input{width:100%;background:#0e0e0e;border:1px solid rgba(227,219,204,.2);color:var(--ink);border-radius:2px;padding:9px 10px;margin-bottom:9px;font:inherit;font-size:13px;outline:0}
.card input:focus{border-color:var(--nude);box-shadow:0 0 0 2px rgba(227,219,204,.2)}
.pri{width:100%;border:0;background:linear-gradient(135deg,#e3dbcc 0%,#c8bea9 100%);color:#101010;border-radius:2px;padding:9px;font-weight:700;box-shadow:0 3px 14px rgba(0,0,0,.4);transition:filter .2s}
.pri:hover{filter:brightness(1.08)}
.tabs{display:flex;gap:4px;margin-bottom:14px;background:#0e0e0e;border-radius:3px;padding:3px}
.tabs button{flex:1;border:0;background:none;padding:6px;border-radius:2px;font-size:12px;color:var(--mute)}
.tabs button.on{background:#262626;color:var(--ink)}
.xx{position:absolute;top:10px;right:12px;border:0;background:none;font-size:16px;color:var(--mute);transition:color .2s}
.xx:hover{color:var(--ink)}
.ferr{color:#ff7b9c;font-size:12px;min-height:16px;margin-bottom:6px}
.note{color:var(--mute);font-size:11px;margin-top:10px;text-align:center}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px}
.plan{border:1px solid rgba(227,219,204,.18);border-radius:3px;padding:14px;display:flex;flex-direction:column;background:#141414;transition:transform .3s cubic-bezier(0.16,1,0.3,1),box-shadow .3s ease,border-color .3s ease}
.plan:hover{transform:translateY(-8px);border-color:var(--nude);box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 20px rgba(227,219,204,.12);z-index:2}
.plan.cur{border-color:var(--nude);box-shadow:0 0 20px rgba(227,219,204,.15)}
.plan h3{margin:0;font:400 17px Georgia,serif;color:var(--ink)}
.plan .pr{font-size:24px;font-weight:700;margin:10px 0 2px;color:var(--ink)}.plan .pr small{font-size:11px;font-weight:400;color:var(--mute)}
.plan ul{list-style:none;padding:0;margin:10px 0;flex:1;font-size:12px;color:var(--ivory)}
.plan li{padding:3px 0}.plan li::before{content:"✓ ";color:var(--nude)}
.plan button{border:1px solid rgba(227,219,204,.2);background:none;border-radius:2px;padding:7px;font-size:12px;color:var(--ink)}
.plan button.go{background:linear-gradient(135deg,#e3dbcc,#c8bea9);color:#101010;border:0;font-weight:700}
.plan button:disabled{opacity:.5;cursor:default}
.cyc{display:inline-flex;background:#0e0e0e;border-radius:3px;padding:3px;gap:3px}
.cyc button{border:0;background:none;padding:5px 12px;border-radius:2px;font-size:12px;color:var(--mute)}
.cyc button.on{background:#262626;color:var(--ink)}
.usr{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:10px 6px 2px;font-size:11.5px}
.usr b{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#e3dbcc,#c8bea9);box-shadow:0 2px 8px rgba(0,0,0,.4);display:grid;place-items:center;font-size:11.5px;color:#101010;font-weight:700}
.usr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usr button{border:0;background:none;color:var(--mute);font-size:11px;text-decoration:underline}
.usr button:hover{color:var(--nude)}
.act{margin-top:6px;display:flex;gap:6px}
.act button{border:1px solid rgba(227,219,204,.18);background:#1f1f1f;border-radius:2px;font-size:11px;padding:3px 9px;color:var(--ivory);transition:all .2s}
.act button:hover{background:#2b2b2b;color:var(--ink);border-color:rgba(227,219,204,.35)}
.media{margin:0;max-width:640px}
.media img{width:100%;display:block;border-radius:3px;background:#0d0d0d;border:1px solid rgba(227,219,204,.2)}
.media figcaption{font-size:11px;color:var(--mute);margin-top:5px}
#vo{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(22,22,22,.95);border:1px solid rgba(227,219,204,.25);border-radius:3px;padding:8px 12px 8px 16px;display:none;align-items:center;gap:12px;z-index:7;font-size:12px;box-shadow:0 10px 40px rgba(0,0,0,.8),0 0 20px rgba(227,219,204,.12);backdrop-filter:blur(10px)}
#vo.on{display:flex}
#vo i{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#e3dbcc,#c8bea9);box-shadow:0 0 10px #e3dbcc;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.25}}
#vo button{border:0;background:#2b2b2b;border-radius:2px;padding:5px 12px;font-size:11px;color:var(--ink);transition:background .2s}
#vo button:hover{background:#383838}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:11px;margin:12px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:#262626}
.gb{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid rgba(227,219,204,.2);background:#0e0e0e;color:var(--ink);border-radius:2px;padding:9px;font-weight:600;font-size:13px;transition:all .2s}
.gb:hover{background:#181818;border-color:rgba(227,219,204,.35)}
.gb svg, .pri svg{width:18px;height:18px;vertical-align:middle}
#ov.auth{padding:0;background:#0c0c0c}
#ov.auth>div{display:block;min-height:100%}
.split{display:flex;min-height:100vh;width:100%;background:#0c0c0c}
.lp{flex:1;margin:10px;border-radius:4px;background:radial-gradient(ellipse 95% 75% at 25% 18%,#23211e 0%,#1a1917 38%,#131210 68%,#0a0a0a 100%);display:flex;align-items:flex-end;justify-content:center;padding:40px 30px;position:relative}
.lc{width:100%;max-width:300px;text-align:center;margin-bottom:5vh}
.lc h2{font:600 22px system-ui,sans-serif;margin:0 0 8px;color:var(--ink)}
.lc p{font-size:11px;color:var(--ivory);margin:0 0 22px}
.steps{display:flex;flex-direction:column;gap:8px;text-align:left}
.st{display:flex;align-items:center;gap:10px;background:rgba(24,24,24,.8);border-radius:3px;padding:10px 12px;font-size:12px;color:var(--ivory)}
.st i{font-style:normal;width:16px;height:16px;border-radius:50%;background:#333;display:grid;place-items:center;font-size:9px;color:var(--ink);flex-shrink:0}
.st.on{background:linear-gradient(135deg,#e3dbcc,#c8bea9);color:#101010}.st.on i{background:#101010;color:var(--ink)}
.st.done i{background:var(--nude);color:#101010}
.rp{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;background:#101010}
.rf{width:100%;max-width:360px}
.rf h2{font:600 20px system-ui,sans-serif;text-align:center;margin:0 0 6px;color:var(--ink)}
.rf p.s{text-align:center;margin-bottom:16px}
.rf label{display:block;font-size:11px;margin:10px 0 5px;color:var(--ivory)}
.rf input{width:100%;background:#141414;border:1px solid rgba(227,219,204,.2);color:var(--ink);border-radius:2px;padding:10px;font:inherit;font-size:12px;outline:0;margin:0}
.rf input:focus{border-color:var(--nude);box-shadow:0 0 0 2px rgba(227,219,204,.2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw{position:relative}.pw input{padding-right:34px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mute);width:20px;height:20px;padding:0}.eye svg{width:16px;height:16px}
.hint{font-size:10.5px;color:var(--mute);margin-top:6px}
.rf .pri{margin-top:12px;padding:11px}
.alt{text-align:center;font-size:11px;color:var(--mute);margin-top:14px}.alt a{color:var(--nude);text-decoration:none;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}

function getGoogleErrorMessage(error) {
  if (!error) return "Google authentication failed. Please try again.";
  var code = error.code || "";
  var msg = error.message || "";

  if (code === "auth/operation-not-supported-in-this-environment") {
    if (window.location.protocol === "file:") {
      return "Google OAuth requires the app server. Run start.bat and open http://localhost:3001.";
    }
    return "This browser environment does not support popups. Run the app at http://localhost:3001 and allow popups, or try again.";
  }
  if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") {
    return "Google sign-in was cancelled.";
  }
  if (code === "auth/popup-blocked") {
    return "Sign-in popup was blocked by your browser. Please allow popups or use redirect sign-in.";
  }
  if (code === "auth/unauthorized-domain") {
    var host = window.location.hostname || "localhost";
    return "Unauthorized domain ('" + host + "'). Please add this domain to Firebase Console > Authentication > Settings > Authorized domains.";
  }
  if (code === "auth/network-request-failed") {
    return "Network connection failure. Please check your internet connection and try again.";
  }
  if (code === "auth/account-exists-with-different-credential") {
    return "An account already exists with this email address using another authentication method. Please sign in with your email and password.";
  }
  if (code === "auth/operation-not-allowed") {
    return "This sign-in method is disabled in Firebase Authentication. Enable Email/Password for password sign-up, or Google for Google sign-in.";
  }
  if (code === "auth/invalid-api-key" || code === "auth/api-key-not-valid") {
    return "Invalid Firebase API key string. The API key must start with 'AIzaSy...', not the key name.";
  }
  if (code === "auth/app-not-authorized") {
    return "Firebase application is not authorized. Please verify your OAuth settings in Google Cloud Console.";
  }
  if (code === "auth/user-disabled") {
    return "This user account has been disabled. Please contact support.";
  }
  if (code === "auth/timeout") {
    return "Google authentication timed out. Please try again.";
  }
  if (msg.indexOf("configuration") > -1 || code.indexOf("config") > -1) {
    return "Firebase configuration error. Please verify your Firebase project settings.";
  }
  if (code === "auth/email-already-in-use") return "An account already uses that email. Sign in with its existing method.";
  if (code === "auth/weak-password") return "Choose a password with at least 6 characters.";
  if (code === "auth/invalid-email") return "Enter a valid email address.";
  if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") return "Email or password is incorrect.";
  if (code === "auth/operation-not-allowed") return "This sign-in method is not enabled in Firebase Authentication. Enable Google and Email/Password in Firebase Console.";
  return "Google authentication failed. Please check your connection and try again.";
}

async function showGoogle() {
  if (isGoogleAuthInProgress) return;
  var b = $("gbtn");
  if (!b && !$("signup-google-fallback")) return;

  var er = $("fer");
  if (er) er.textContent = "";

  if (window.location.protocol === "file:") {
    if (er) er.textContent = "Google sign-in cannot run from a file. Run start.bat, then open http://localhost:3001 in your browser.";
    return;
  }

  if (!isFirebaseConfigured()) {
    showFirebaseConfigModal(function() {
      showGoogle();
    });
    return;
  }

  isGoogleAuthInProgress = true;
  setGoogleLoading(true, "Connecting to Google...");

  try {
    var auth = await ensureFirebaseAuth();
    if (!auth) {
      showFirebaseConfigModal(function() {
        showGoogle();
      });
      return;
    }

    var provider = new GoogleAuthProvider();
    provider.addScope("profile");
    provider.addScope("email");
    provider.setCustomParameters({
      prompt: "select_account"
    });

    setGoogleLoading(true, "Awaiting Google verification...");

    var result = null;
    try {
      result = await signInWithPopup(auth, provider);
    } catch (popupErr) {
      if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment"].includes(popupErr.code)) {
        toast("Sign-in popup was blocked. Redirecting to Google...");
        setGoogleLoading(true, "Redirecting to Google...");
        await signInWithRedirect(auth, provider);
        return;
      }
      throw popupErr;
    }

    if (result && result.user) {
      var onboarding = SU && SU.d && SU.d.em ? SU.d : null;
      if (onboarding && result.user.email) {
        var accountEmail = result.user.email.trim().toLowerCase(), accountStore = users(), account = accountStore[accountEmail] || {};
        account.email = accountEmail; account.name = result.user.displayName || account.name || (accountEmail.split("@")[0]); account.uid = result.user.uid; account.photoURL = result.user.photoURL || account.photoURL || ""; account.plan = account.plan || "basic"; account.ws = onboarding.ws || account.ws || ""; account.use = onboarding.use || account.use || []; account.createdAt = account.createdAt || Date.now(); accountStore[accountEmail] = account; putUsers(accountStore); SU = { d: {} };
      }
      await handleGoogleSuccess(result.user);
    } else {
      throw new Error("No authenticated user returned from Google.");
    }
  } catch (err) {
    var friendly = getGoogleErrorMessage(err);
    console.warn("PHOTON AI Google authentication failed:", err && err.code || "unknown");
    
    // Clear invalid key from localStorage so it doesn't get stuck in an endless error loop
    if (err.code === "auth/invalid-api-key" || err.code === "auth/api-key-not-valid") {
      try { localStorage.removeItem("photon-firebase-config"); } catch(e) {}
    }

    if (er) er.textContent = friendly;
    toast(friendly);

    // Prompt configuration modal automatically with helpful explanation
    if (err.code === "auth/invalid-api-key" || err.code === "auth/api-key-not-valid") {
      setTimeout(function() {
        showFirebaseConfigModal(function() { showGoogle(); }, "The API key was rejected by Google. Ensure you enter the key string starting with 'AIzaSy...', not the key name. Or click 'Open PHOTON AI Directly' above.");
      }, 600);
    }
  } finally {
    isGoogleAuthInProgress = false;
    setGoogleLoading(false);
  }
}

  var em = (fbUser.email || "").trim().toLowerCase();
  var nm = fbUser.displayName || (em ? em.split("@")[0] : "PHOTON User");
  var uid = fbUser.uid || "";
  var photo = fbUser.photoURL || "";

  if (!em) {
    throw new Error("Google account did not return a valid email address.");
  }

  var U = users();
  var existingKey = null;

  if (U[em]) {
    existingKey = em;
  } else {
    for (var k in U) {
      if (U[k] && U[k].uid === uid) {
        existingKey = k;
        break;
      }
    }
  }

  if (existingKey) {
    var existing = U[existingKey];
    existing.uid = uid;
    if (photo) existing.photoURL = photo;
    if (!existing.name || existing.name === "Google user" || existing.name === "PHOTON User") {
      existing.name = nm;
    }
    if (!existing.plan) existing.plan = "basic";
    if (!existing.cycle) existing.cycle = "monthly";
    existing.email = em;
    delete existing.h;
    putUsers(U);
    sess(existingKey, remember !== false);
    toast("Welcome back to PHOTON AI, " + (existing.name || nm).split(" ")[0] + "!");
    try{await profileApi("/api/profile/sign-in",{method:"POST",body:photo?{photoURL:photo}:{}})}catch(e){}
    enter(existingKey);
  } else {
    U[em] = {
      uid: uid,
      name: nm,
      email: em,
      photoURL: photo,
      provider: "google",
      plan: "basic",
      cycle: "monthly",
      ws: "",
      use: [],
      createdAt: Date.now()
    };
    putUsers(U);
    sess(em, remember !== false);
    toast("Welcome to PHOTON AI, " + nm.split(" ")[0] + "!");
    try{await profileApi("/api/profile/sign-in",{method:"POST",body:photo?{photoURL:photo}:{}})}catch(e){}
    enter(em);
  }
}

async function checkRedirectAuth() {
  if (!isFirebaseConfigured()) return;
  try {
    var auth = await ensureFirebaseAuth();
    if (!auth) return;

    var result = await getRedirectResult(auth);
    if (result && result.user) {
      await handleGoogleSuccess(result.user);
      return;
    }

    auth.onAuthStateChanged(function(fbUser) {
      if (fbUser && fbUser.email) handleGoogleSuccess(fbUser).catch(function(){showAuth("login")});
      else { try{localStorage.removeItem("photon-session");sessionStorage.removeItem("photon-session")}catch(e){} }
    });
  } catch (err) {
    console.warn("PHOTON AI Redirect Auth:", err);
    var friendly = getGoogleErrorMessage(err);
    toast(friendly);
  }
}

function loadRazorpayCheckout(){
