<style>
:root{
  --bg:#080A11;
  --side:#0B0E18;
  --btn:#10162E;
  --btn2:#17203F;
  --card:#0D1326;
  --ink:#F1F5F9;
  --off-white:#FFFFFF;
  --ivory:#E2E8F0;
  --nude:#8298FF;
  --mute:#7E8BA4;
  --line:rgba(255,255,255,.08);
  --accent:#8298FF;
  --accent-glow:rgba(130,152,255,.25);
  --primary:#8298FF;
  --p-pink:#C084FC;
  --p-violet:#818CF8;
  --p-blue:#60A5FA;
  --p-cyan:#38BDF8;
  --p-deep:#080A11;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#333 transparent}
[hidden]{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#444;background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-corner{background:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#side{width:205px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 8px;gap:6px;flex-shrink:0;transition:margin .2s;z-index:6}
#side.hide{margin-left:-205px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.08em;font-size:13.5px;padding:3px 6px 10px;color:var(--ink)}
.logo img,.brand-logo-img{width:22px;height:22px;display:block;object-fit:contain;mix-blend-mode:screen;filter:brightness(1.2) contrast(1.1)}
.search-chat-btn{text-align:center}.chat-search-input{width:100%;margin:3px 0 6px;padding:8px 9px;border:1px solid rgba(130,152,255,0.22);border-radius:4px;background:#111;color:var(--ink);font:inherit;font-size:12px}.chat-search-input:focus{outline:1px solid var(--cream)}
.sb{border:1px solid rgba(255,255,255,0.08);background:var(--btn);color:var(--ink);border-radius:2px;padding:6px 8px;font-size:11.5px;width:100%;transition:all .2s;font-weight:500}
.sb:hover{background:var(--btn2);border-color:rgba(130,152,255,0.22);box-shadow:0 2px 8px rgba(0,0,0,.5)}
#upg{background:linear-gradient(135deg, #8298FF 0%, #6366F1 100%);border:0;border-radius:2px;color:#101010;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.5);transition:filter .2s,box-shadow .2s}
#upg:hover{filter:brightness(1.08);box-shadow:0 3px 14px rgba(130,152,255,0.22)}
.lbl{font-size:11px;color:var(--mute);padding:10px 6px 4px;letter-spacing:.04em;text-transform:uppercase}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.ci{display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:2px;cursor:pointer;font-size:12px;color:#C5D0E6;transition:all .15s;border-left:2px solid transparent}
.ci:hover,.ci.on{background:linear-gradient(90deg,rgba(255,255,255,0.08) 0%,rgba(255,255,255,0.04) 100%);color:var(--ink);border-left-color:var(--nude)}
.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci button{border:0;background:none;color:var(--mute);opacity:0;padding:0 3px}
.ci:hover button{opacity:1}
#main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0;height:100%;background:radial-gradient(circle at 50% 15%,rgba(130,152,255,.07) 0%,transparent 65%),var(--bg)}
#topo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#top{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
#top > *{pointer-events:auto}
.irx-top-left{display:flex;align-items:center;gap:10px}
.irx-studio-nav{display:flex;align-items:center;background:rgba(16,22,46,.75);border:1px solid var(--line);border-radius:8px;padding:3px;backdrop-filter:blur(8px)}
.irx-tab{border:0;background:none;color:var(--mute);font-size:12px;padding:5px 12px;border-radius:6px;transition:all .15s;font-weight:500;white-space:nowrap}
.irx-tab:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.irx-tab.on{color:#fff;background:rgba(130,152,255,.2);font-weight:600;box-shadow:0 0 12px rgba(130,152,255,.2)}
.irx-top-right{display:flex;align-items:center;gap:8px}
#plan{background:rgba(16,22,46,.75);border:1px solid var(--line);backdrop-filter:blur(8px);padding:4px 10px;font-size:11.5px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.4);color:var(--ivory);display:flex;align-items:center;gap:6px}
.irx-plan-pill{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;background:rgba(130,152,255,.15);color:var(--accent);padding:2px 6px;border-radius:4px;border:1px solid rgba(130,152,255,.3)}
#plan a,.up{color:var(--nude);text-decoration:none;font-weight:600;cursor:pointer;transition:color .2s}
#plan a:hover,.up:hover{color:var(--ink);text-shadow:0 0 8px rgba(130,152,255,.5)}
#tog{width:32px;height:30px;border:1px solid var(--line);background:rgba(16,22,46,.75);backdrop-filter:blur(8px);border-radius:6px;display:grid;place-items:center;padding:0;transition:all .2s}
#tog:hover{background:rgba(23,32,63,.95);border-color:rgba(130,152,255,.35)}
#tog svg{width:16px;height:16px;stroke:var(--ivory)}
#hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}
.irx-hero-badge{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);background:rgba(130,152,255,.1);border:1px solid rgba(130,152,255,.25);padding:4px 12px;border-radius:99px;margin-bottom:12px;box-shadow:0 0 16px rgba(130,152,255,.15)}
#hero h1{font:600 clamp(26px,4vw,38px)/1.2 system-ui,-apple-system,sans-serif;letter-spacing:-.02em;margin:0 0 8px;text-align:center;color:#FFFFFF;text-shadow:0 2px 20px rgba(0,0,0,.8)}
.irx-hero-sub{font-size:13.5px;color:var(--mute);margin:0 0 24px;text-align:center;max-width:560px;line-height:1.5}
.irx-cards-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(720px,100%);margin-top:24px}
@media(max-width:640px){.irx-cards-grid{grid-template-columns:1fr}.irx-studio-nav{display:none}}
.irx-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:rgba(13,19,38,.7);border:1px solid rgba(255,255,255,.08);border-radius:12px;text-align:left;cursor:pointer;transition:all .2s ease;backdrop-filter:blur(8px)}
.irx-card:hover{background:rgba(16,22,46,.95);border-color:rgba(130,152,255,.35);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 16px rgba(130,152,255,.15)}
.irx-card-icon{width:38px;height:38px;border-radius:10px;background:rgba(130,152,255,.12);border:1px solid rgba(130,152,255,.25);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.irx-card-icon svg{width:20px;height:20px}
.irx-card-text{flex:1;min-width:0}
.irx-card-title{font-size:13px;font-weight:600;color:#F8FAFC;margin-bottom:2px}
.irx-card-desc{font-size:11px;color:var(--mute);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.irx-card-arrow{font-size:14px;color:var(--mute);transition:transform .2s,color .2s}
.irx-card:hover .irx-card-arrow{color:var(--accent);transform:translateX(3px)}

@keyframes prismSpin{0%{transform:scale(.95) rotate(-3deg)}50%{transform:scale(1.05) rotate(3deg)}100%{transform:scale(.95) rotate(-3deg)}}

#msgs{flex:1;overflow-y:auto;padding:58px 18px 12px;position:relative;z-index:1}
.row{display:flex;max-width:760px;width:100%;margin:0 auto 14px}
.row.u{justify-content:flex-end}
.b{padding:9px 13px;border-radius:3px;overflow-wrap:anywhere;max-width:100%}
.u .b{background:linear-gradient(135deg,rgba(255,255,255,0.08) 0%,rgba(243,240,233,.08) 100%);border:1px solid rgba(130,152,255,0.22);white-space:pre-wrap;border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.35);color:var(--ink)}
.a .b{width:100%;padding-left:2px;color:var(--ivory)}
.b p{margin:.4em 0}.b h1,.b h2,.b h3{margin:.8em 0 .3em;font-family:'JetBrains Mono', system-ui, -apple-system, sans-serif;font-weight:400;line-height:1.25;color:var(--ink)}.b h1{font-size:1.4em}.b h2{font-size:1.2em}.b h3{font-size:1.05em}
.b ul,.b ol{margin:.4em 0;padding-left:1.4em}
.b code{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:var(--off-white);padding:1px 5px;border-radius:2px;font:12.5px ui-monospace,Menlo,Consolas,monospace}
.pre{position:relative;margin:.6em 0}
.pre pre{margin:0;background:#0c0c0c;border:1px solid rgba(255,255,255,0.08);border-radius:3px;padding:24px 14px 12px;overflow-x:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace}
.pre pre code{background:none;border:0;color:var(--ivory);padding:0}
.pre small{position:absolute;top:6px;left:12px;color:var(--mute);font-size:10px}
.pre button{position:absolute;top:4px;right:6px;border:1px solid rgba(255,255,255,0.08);background:#1a1a1a;color:var(--ivory);border-radius:2px;font-size:10px;padding:2px 8px;transition:all .2s}
.pre button:hover{background:#2a2a2a;color:var(--ink);border-color:rgba(130,152,255,0.22)}
.think{color:var(--mute);font-style:italic}.err{color:#ff7b9c}

/* CHATBOX WITH FLOWING THEME BORDER */
#comp{width:100%;max-width:540px;margin:0 auto;position:relative;z-index:2}
#main.chat #comp{margin:0 auto;padding:0 18px 16px;max-width:796px}

.box-flow-wrap{position:relative;border-radius:3px;transition:all .3s ease}
.flow-glow,.flow-beam{position:absolute;inset:-2px;border-radius:3px;pointer-events:none;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s ease}
.flow-glow{filter:blur(12px);opacity:0;z-index:0}
.flow-beam{z-index:1;padding:2px;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* When chatbox is empty / before entering anything, flow theme flows around the box */
.box-flow-wrap.flowing .flow-beam{opacity:1;visibility:visible}
.box-flow-wrap.flowing .flow-glow{opacity:.6;visibility:visible}

.flow-glow::before,.flow-beam::before{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  width:280%;
  height:500%;
  background:conic-gradient(from 0deg, #8298FF 0%, #C084FC 25%, #60A5FA 50%, #818CF8 75%, rgba(130,152,255,.4) 90%, #8298FF 100%);
  transform:translate(-50%,-50%);
  animation:flowSpin 3.8s linear infinite;
}
@keyframes flowSpin{0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(360deg)}}

#box{position:relative;z-index:2;background:rgba(22,22,22,.96);backdrop-filter:blur(12px);border-radius:2px;padding:12px 14px 10px;box-shadow:0 4px 26px rgba(0,0,0,.65);border:1px solid rgba(255,255,255,0.08);transition:border-color .3s ease,box-shadow .3s ease}
#main.chat #box{border:1px solid rgba(255,255,255,0.08)}
.box-flow-wrap.has-text #box{border-color:rgba(130,152,255,0.22);box-shadow:0 4px 20px rgba(0,0,0,.6),0 0 12px rgba(255,255,255,0.08)}

textarea{display:block;width:100%;border:0;outline:0;background:none;resize:none;color:var(--ink);font:inherit;font-size:12.5px;max-height:160px;min-height:34px;padding:0}
textarea::placeholder{color:var(--mute)}
.tools{display:flex;align-items:center;margin-top:8px;gap:12px}
.chat-file-list{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 8px}.chat-file-chip{display:inline-flex;align-items:center;gap:7px;max-width:min(290px,100%);padding:5px 8px;border:1px solid rgba(255,255,255,0.08);border-radius:4px;background:#242321;color:var(--ivory);font-size:10px}.chat-file-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-file-chip small{color:var(--mute);white-space:nowrap}.chat-file-chip button{border:0;background:none;color:var(--mute);font-size:14px;line-height:1;cursor:pointer;padding:0 1px}.chat-file-chip button:hover{color:#ff9e9e}.row.u .file-attachments{display:flex;flex-direction:column;gap:8px;margin-top:8px}.row.u .file-attachments span{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,0.08);border-radius:4px;padding:4px 7px;color:var(--mute);font-size:10px}.chat-att-img-card{max-width:340px;border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,0.08);background:#1a1918;box-shadow:0 4px 16px rgba(0,0,0,.45)}.chat-att-img-card img{display:block;width:100%;max-height:220px;object-fit:cover;cursor:pointer;transition:opacity .15s}.chat-att-img-card img:hover{opacity:.9}.chat-att-img-info{display:flex;align-items:center;justify-content:space-between;padding:6px 9px;background:#242321;gap:8px;font-size:11px}.chat-att-img-info span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ivory);flex:1}.chat-att-img-info button,.chat-att-chip button{border:0;background:rgba(255,255,255,0.08);color:var(--ivory);border-radius:3px;padding:3px 8px;font-size:10.5px;cursor:pointer;transition:background .2s;white-space:nowrap}.chat-att-img-info button:hover,.chat-att-chip button:hover{background:rgba(130,152,255,0.22);color:var(--ink)}.chat-att-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,0.08);border-radius:4px;padding:5px 9px;color:var(--ivory);font-size:11px;background:#242321;max-width:fit-content}
.tools .sp{flex:1}
.ib{border:0;background:none;padding:0;display:grid;place-items:center;width:20px;height:20px;color:var(--ivory);transition:color .2s}
.ib:hover{color:var(--ink)}
.ib svg{width:15px;height:15px}
.ib.plus svg{width:17px;height:17px}
.ib.rec{color:#ff5c7a}
.box-flow-wrap.has-text #go{color:var(--nude);filter:drop-shadow(0 0 6px rgba(130,152,255,0.35))}
#pop{position:absolute;bottom:calc(100% + 6px);left:0;background:#181818;border:1px solid rgba(255,255,255,0.08);border-radius:3px;padding:4px;display:none;min-width:205px;box-shadow:0 10px 40px rgba(0,0,0,.8);z-index:10}
#pop.on{display:block}
#pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:2px;font-size:12px;color:var(--ivory)}
#pop button:hover,#pop button.on{background:rgba(255,255,255,0.08);color:var(--ink)}
#pop button.on::after{content:" ✓";color:var(--nude)}
#modeTag{font-size:10px;color:var(--nude);display:none;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1f1f1f;border:1px solid rgba(130,152,255,0.22);box-shadow:0 8px 30px rgba(0,0,0,.8);color:var(--ink);padding:6px 14px;border-radius:3px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
@media(max-width:720px){#side{position:fixed;inset:0 auto 0 0;padding-top:calc(12px + env(safe-area-inset-top,0px));margin-left:-205px}#side.show{margin-left:0;box-shadow:0 0 50px rgba(0,0,0,.85)}#side.hide{margin-left:-205px}}

#ov{position:fixed;inset:0;background:rgba(10,10,10,.86);backdrop-filter:blur(6px);z-index:8;display:none;overflow:auto;padding:20px}
#ov.on{display:block}
#ov>div{margin:auto;min-height:100%;display:flex;align-items:center;justify-content:center}
#ov.profile-overlay{padding:0;background:#090909;backdrop-filter:none}
#ov.profile-overlay>div{display:block;min-height:100%;width:100%}
.card{background:#181818;border:1px solid rgba(255,255,255,0.08);border-radius:4px;padding:24px;width:100%;max-width:390px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.card.wide{max-width:980px}
.card h2{font:400 22px 'JetBrains Mono', system-ui, -apple-system, sans-serif;margin:0 0 4px;color:var(--ink)}
.card p.s{color:var(--mute);margin:0 0 14px;font-size:12px}
.card input{width:100%;background:#0e0e0e;border:1px solid rgba(255,255,255,0.08);color:var(--ink);border-radius:2px;padding:9px 10px;margin-bottom:9px;font:inherit;font-size:13px;outline:0}
.card input:focus{border-color:var(--nude);box-shadow:0 0 0 2px rgba(255,255,255,0.08)}
.pri{width:100%;border:0;background:linear-gradient(135deg, #8298FF 0%, #6366F1 100%);color:#101010;border-radius:2px;padding:9px;font-weight:700;box-shadow:0 3px 14px rgba(0,0,0,.4);transition:filter .2s}
.pri:hover{filter:brightness(1.08)}
.tabs{display:flex;gap:4px;margin-bottom:14px;background:#0e0e0e;border-radius:3px;padding:3px}
.tabs button{flex:1;border:0;background:none;padding:6px;border-radius:2px;font-size:12px;color:var(--mute)}
.tabs button.on{background:#262626;color:var(--ink)}
.xx{position:absolute;top:10px;right:12px;border:0;background:none;font-size:16px;color:var(--mute);transition:color .2s}
.xx:hover{color:var(--ink)}
.ferr{color:#ff7b9c;font-size:12px;min-height:16px;margin-bottom:6px}
.note{color:var(--mute);font-size:11px;margin-top:10px;text-align:center}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px}
.plan{border:1px solid rgba(255,255,255,0.08);border-radius:3px;padding:14px;display:flex;flex-direction:column;background:#141414;transition:transform .3s cubic-bezier(0.16,1,0.3,1),box-shadow .3s ease,border-color .3s ease}
.plan:hover{transform:translateY(-8px);border-color:var(--nude);box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 20px rgba(255,255,255,0.08);z-index:2}
.plan.cur{border-color:var(--nude);box-shadow:0 0 20px rgba(255,255,255,0.08)}
.plan h3{margin:0;font:400 17px 'JetBrains Mono', system-ui, -apple-system, sans-serif;color:var(--ink)}
.plan .pr{font-size:24px;font-weight:700;margin:10px 0 2px;color:var(--ink)}.plan .pr small{font-size:11px;font-weight:400;color:var(--mute)}
.plan ul{list-style:none;padding:0;margin:10px 0;flex:1;font-size:12px;color:var(--ivory)}
.plan li{padding:3px 0}.plan li::before{content:"✓ ";color:var(--nude)}
.plan button{border:1px solid rgba(255,255,255,0.08);background:none;border-radius:2px;padding:7px;font-size:12px;color:var(--ink)}

async function ensureFirebaseAuth() {
  if (firebaseAuth) return firebaseAuth;

  if (!window.firebase || !window.firebase.auth) {
    await new Promise(function(resolve, reject) {
      var s1 = document.createElement("script");
      s1.src = "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js";
      s1.onload = function() {
        var s2 = document.createElement("script");
        s2.src = "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js";
        s2.onload = function() {
          GoogleAuthProvider = window.firebase.auth.GoogleAuthProvider;
          resolve();
        };
        s2.onerror = function() { reject(new Error("Network connection failure while loading Firebase Auth.")); };
        document.head.appendChild(s2);
      };
      s1.onerror = function() { reject(new Error("Network connection failure while loading Firebase App.")); };
      document.head.appendChild(s1);
    });
  }

  if (!window.firebase || !window.firebase.auth) {
    throw new Error("Firebase SDK could not be initialized. Please check your internet connection.");
  }

  GoogleAuthProvider = window.firebase.auth.GoogleAuthProvider;

  var cfg = getFirebaseConfig();
  if (!isFirebaseConfigured()) {
    return null;
  }

  try {
    if (!window.firebase.apps.length) {
      firebaseApp = window.firebase.initializeApp(cfg);
    } else {
      firebaseApp = window.firebase.app();
    }
    firebaseAuth = window.firebase.auth();
    try {
      await firebaseAuth.setPersistence(window.firebase.auth.Auth.Persistence.LOCAL);
    } catch (pe) {
      console.warn("PHOTON AI persistence notice:", pe);
    }
    return firebaseAuth;
  } catch (initErr) {
    console.error("PHOTON AI Firebase Init Error:", initErr);
    throw initErr;
  }
}

function getGoogleErrorMessage(error) {
  if (!error) return "Google authentication failed. Please try again.";
  var code = error.code || "";
  var msg = error.message || "";

  if (code === "auth/operation-not-supported-in-this-environment") {
    if (window.location.protocol === "file:") {
      return "Google OAuth requires the app server. Run start.bat and open http://localhost:3001.";
    }
    return "This browser environment does not support popups. Run the app at http://localhost:3001 and allow popups, or try again.";
  }
  if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") {
    return "Google sign-in was cancelled.";
  }
  if (code === "auth/popup-blocked") {
    return "Sign-in popup was blocked by your browser. Please allow popups or use redirect sign-in.";
  }
  if (code === "auth/unauthorized-domain") {
    var host = window.location.hostname || "localhost";
    return "Unauthorized domain ('" + host + "'). Please add this domain to Firebase Console > Authentication > Settings > Authorized domains.";
  }
  if (code === "auth/network-request-failed") {
    return "Network connection failure. Please check your internet connection and try again.";
  }
  if (code === "auth/account-exists-with-different-credential") {
    return "An account already exists with this email address using another authentication method. Please sign in with your email and password.";
  }
  if (code === "auth/operation-not-allowed") {
    return "This sign-in method is disabled in Firebase Authentication. Enable Email/Password for password sign-up, or Google for Google sign-in.";
  }
  if (code === "auth/invalid-api-key" || code === "auth/api-key-not-valid") {
    return "Invalid Firebase API key string. The API key must start with 'AIzaSy...', not the key name.";
  }
  if (code === "auth/app-not-authorized") {
    return "Firebase application is not authorized. Please verify your OAuth settings in Google Cloud Console.";
  }
  if (code === "auth/user-disabled") {
    return "This user account has been disabled. Please contact support.";
  }
  if (code === "auth/timeout") {
    return "Google authentication timed out. Please try again.";
  }
  if (msg.indexOf("configuration") > -1 || code.indexOf("config") > -1) {
    return "Firebase configuration error. Please verify your Firebase project settings.";
  }
  if (code === "auth/email-already-in-use") return "An account already uses that email. Sign in with its existing method.";
  if (code === "auth/weak-password") return "Choose a password with at least 6 characters.";
  if (code === "auth/invalid-email") return "Enter a valid email address.";
  if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") return "Email or password is incorrect.";
  if (code === "auth/operation-not-allowed") return "This sign-in method is not enabled in Firebase Authentication. Enable Google and Email/Password in Firebase Console.";
  return "Google authentication failed. Please check your connection and try again.";
}

async function showGoogle() {
  if (isGoogleAuthInProgress) return;
  var b = $("gbtn");
  if (!b && !$("signup-google-fallback")) return;

  var er = $("fer");
  if (er) er.textContent = "";

  if (window.location.protocol === "file:") {
    if (er) er.textContent = "Google sign-in cannot run from a file. Run start.bat, then open http://localhost:3001 in your browser.";
    return;
  }

  if (!isFirebaseConfigured()) {
    showFirebaseConfigModal(function() {
      showGoogle();
    });
    return;
  }

  isGoogleAuthInProgress = true;
  setGoogleLoading(true, "Connecting to Google...");

  try {
    var auth = await ensureFirebaseAuth();
    if (!auth) {
      showFirebaseConfigModal(function() {
        showGoogle();
      });
      return;
    }

    var provider = new GoogleAuthProvider();
    provider.addScope("profile");
    provider.addScope("email");
    provider.setCustomParameters({
      prompt: "select_account"
    });

    setGoogleLoading(true, "Awaiting Google verification...");

    var result = null;
    try {
      result = await signInWithPopup(auth, provider);
    } catch (popupErr) {
      if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment"].includes(popupErr.code)) {
        toast("Sign-in popup was blocked. Redirecting to Google...");
        setGoogleLoading(true, "Redirecting to Google...");
        await signInWithRedirect(auth, provider);
        return;
      }
      throw popupErr;
    }

    if (result && result.user) {
      var onboarding = SU && SU.d && SU.d.em ? SU.d : null;
      if (onboarding && result.user.email) {
        var accountEmail = result.user.email.trim().toLowerCase(), accountStore = users(), account = accountStore[accountEmail] || {};
        account.email = accountEmail; account.name = result.user.displayName || account.name || (accountEmail.split("@")[0]); account.uid = result.user.uid; account.photoURL = result.user.photoURL || account.photoURL || ""; account.plan = account.plan || "basic"; account.ws = onboarding.ws || account.ws || ""; account.use = onboarding.use || account.use || []; account.createdAt = account.createdAt || Date.now(); accountStore[accountEmail] = account; putUsers(accountStore); SU = { d: {} };
      }
      await handleGoogleSuccess(result.user);
    } else {
      throw new Error("No authenticated user returned from Google.");
    }
  } catch (err) {
    var friendly = getGoogleErrorMessage(err);
    console.warn("PHOTON AI Google authentication failed:", err && err.code || "unknown");
    
    // Clear invalid key from localStorage so it doesn't get stuck in an endless error loop
    if (err.code === "auth/invalid-api-key" || err.code === "auth/api-key-not-valid") {
      try { localStorage.removeItem("photon-firebase-config"); } catch(e) {}
    }

    if (er) er.textContent = friendly;
    toast(friendly);

    // Prompt configuration modal automatically with helpful explanation
    if (err.code === "auth/invalid-api-key" || err.code === "auth/api-key-not-valid") {
      setTimeout(function() {
        showFirebaseConfigModal(function() { showGoogle(); }, "The API key was rejected by Google. Ensure you enter the key string starting with 'AIzaSy...', not the key name. Or click 'Open PHOTON AI Directly' above.");
      }, 600);
    }
  } finally {
    isGoogleAuthInProgress = false;
    setGoogleLoading(false);
  }
}

async function handleGoogleSuccess(fbUser, remember) {
  if (!fbUser) return;
  var em = (fbUser.email || "").trim().toLowerCase();
  var nm = fbUser.displayName || (em ? em.split("@")[0] : "PHOTON User");
  var uid = fbUser.uid || "";
  var photo = fbUser.photoURL || "";

  if (!em) {
    throw new Error("Google account did not return a valid email address.");
  }

  var U = users();
  var existingKey = null;

  if (U[em]) {
    existingKey = em;
  } else {
    for (var k in U) {
      if (U[k] && U[k].uid === uid) {
        existingKey = k;
        break;
      }
    }
  }

  if (existingKey) {
    var existing = U[existingKey];
    existing.uid = uid;
    if (photo) existing.photoURL = photo;
    if (!existing.name || existing.name === "Google user" || existing.name === "PHOTON User") {
      existing.name = nm;
    }
    if (!existing.plan) existing.plan = "basic";
    if (!existing.cycle) existing.cycle = "monthly";
    existing.email = em;
    delete existing.h;
    putUsers(U);
    sess(existingKey, remember !== false);
    toast("Welcome back to PHOTON AI, " + (existing.name || nm).split(" ")[0] + "!");
    try{await profileApi("/api/profile/sign-in",{method:"POST",body:photo?{photoURL:photo}:{}})}catch(e){}
    enter(existingKey);
  } else {
    U[em] = {
      uid: uid,
      name: nm,
      email: em,
      photoURL: photo,
      provider: "google",
      plan: "basic",
      cycle: "monthly",
      ws: "",
      use: [],
      createdAt: Date.now()
    };
    putUsers(U);
    sess(em, remember !== false);
    toast("Welcome to PHOTON AI, " + nm.split(" ")[0] + "!");
    try{await profileApi("/api/profile/sign-in",{method:"POST",body:photo?{photoURL:photo}:{}})}catch(e){}
    enter(em);
  }
}

async function checkRedirectAuth() {
  if (!isFirebaseConfigured()) return;
  try {
    var auth = await ensureFirebaseAuth();
    if (!auth) return;

    var result = await getRedirectResult(auth);
    if (result && result.user) {
      await handleGoogleSuccess(result.user);
      return;
    }

    auth.onAuthStateChanged(function(fbUser) {
      if (fbUser && fbUser.email) handleGoogleSuccess(fbUser).catch(function(){showAuth("login")});
      else { try{localStorage.removeItem("photon-session");sessionStorage.removeItem("photon-session")}catch(e){} }
    });
  } catch (err) {
    console.warn("PHOTON AI Redirect Auth:", err);
    var friendly = getGoogleErrorMessage(err);
    toast(friendly);
  }
}

function formatPhotonRelativeTime(timestamp) {
  if(!timestamp) return "1d ago";
  var time = typeof timestamp === "number" ? timestamp : new Date(timestamp).getTime();
  if(isNaN(time)) return "1d ago";
  var diff = Math.floor((Date.now() - time) / 1000);
  if(diff < 60) return "just now";
  var m = Math.floor(diff / 60);
  if(m < 60) return m + "m ago";
  var h = Math.floor(m / 60);
  if(h < 24) return h + "h ago";
  var d = Math.floor(h / 24);
  if(d < 30) return d + "d ago";
  var mo = Math.floor(d / 30);
  if(mo < 12) return mo + "mo ago";
  return Math.floor(mo / 12) + "y ago";
}


/* ==================== PHOTON CLIENT-SIDE ROUTER ==================== */
function setActiveNav(navId) {
  document.querySelectorAll(".irx-nav-item").forEach(function(el) {
    el.classList.remove("active");
  });
  if(navId) {
    var target = document.getElementById(navId);
    if(target) target.classList.add("active");
  }
}
window.setActiveNav = setActiveNav;

window.navigateToRoute = function(route, pushState) {
  var path = (route || "/").toLowerCase().trim();
  if(path.endsWith(".html")) path = path.replace(/\.html$/, "") || "/";
  if(!path.startsWith("/")) path = "/" + path;

  if(pushState !== false) {
    if(window.location.pathname !== path) {
      try {
        window.history.pushState({ route: path }, "", path);
      } catch(e) {}
    }
  }

  // Active navigation highlight
  var navMap = {
    "/": "",
    "/search": "nav-search",
    "/history": "nav-history",
    "/projects": "proj",
    "/library": "nav-library",
    "/artifacts": "art",
    "/studio": "nav-studio",
    "/plugins": "nav-plugins",
    "/settings": "profile-nav",
    "/profile": "profile-nav"
  };

  var targetId = navMap[path] !== undefined ? navMap[path] : "";
  window.setActiveNav(targetId);

  if(window.innerWidth <= 720) {
    var s = document.getElementById("side");
    if(s) s.classList.remove("show");
  }

  switch(path) {
    case "/search":
      if(typeof showSearch === "function") showSearch();
      break;
    case "/history":
      if(typeof showHistory === "function") showHistory();
      break;
    case "/projects":
      if(typeof showProjects === "function") showProjects();
      break;
    case "/library":
      if(typeof showLibrary === "function") showLibrary();
      break;
    case "/artifacts":
      if(typeof showArtifacts === "function") showArtifacts();
      else if(typeof showArtifactsViewWrapper === "function") showArtifactsViewWrapper();
      break;
    case "/studio":
      if(typeof showStudio === "function") showStudio();
      break;
    case "/plugins":
      if(typeof showPlugins === "function") showPlugins();
      break;
    case "/settings":
    case "/profile":
      if(typeof showSettings === "function") showSettings();
      break;
    case "/":
    default:
      if(typeof closePv === "function") closePv();
      break;
  }
};

window.addEventListener("popstate", function() {
  var currentPath = window.location.pathname;
  window.navigateToRoute(currentPath, false);
});

        var allArts = (typeof artifactItems !== "undefined" && Array.isArray(artifactItems) && artifactItems.length) ?

        var matchedArts = allArts.filter(function(a) {

  pvOpen(html);

  // Wire Upload

  var upInp = $("lib-file-input");
  if(upBtn && upInp) {
    upBtn.onclick = function() { upInp.click(); };
    upInp.onchange = function(e) {
      var files = Array.from(e.target.files || []);
      if(!files.length) return;
      var remaining = files.length;
      files.forEach(function(f) {
        var reader = new FileReader();
        var isImg = f.type.startsWith("image/");
        reader.onload = function(evt) {
          var ext = (f.name.split(".").pop() || "").toLowerCase();
          var cat = "documents";
          if(["png","jpg","jpeg","webp","gif","svg","bmp","ico"].includes(ext) || isImg) cat = "images";
          else if(["mp4","webm","mov","mkv","avi"].includes(ext) || f.type.startsWith("video/")) cat = "video";
          else if(["mp3","wav","ogg","m4a","flac"].includes(ext) || f.type.startsWith("audio/")) cat = "audio";
          else if(["zip","tar","gz","7z","rar"].includes(ext)) cat = "archives";

          photonLibraryFiles.unshift({
            id: "lib-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
            name: f.name,
            size: f.size,
            type: f.type || "application/octet-stream",
            category: cat,
            dataUrl: isImg ? evt.target.result : null,
            at: Date.now()
          });
          remaining--;
          if(remaining === 0) {
            savePhotonLibrary();
            upInp.value = "";
            renderLibraryList();
          }
        };
        if(isImg) reader.readAsDataURL(f);
        else reader.readAsText(f.slice(0, 500)); // light read
      });
    };
  }

  var currentCat = "all";
  var currentQuery = "";
  var currentSort = "newest";

  // Tab clicks
  var tabs = document.querySelectorAll("#lib-cat-tabs .photon-lib-tab");
  tabs.forEach(function(t) {
    t.onclick = function() {
      tabs.forEach(function(x){ x.classList.remove("on"); });
      t.classList.add("on");
      currentCat = t.dataset.cat;
      renderLibraryList();
    };
  });

  // Search input
  var sinp = $("lib-search-input");
  if(sinp) {
    sinp.oninput = function() {
      currentQuery = sinp.value.trim().toLowerCase();
      renderLibraryList();
    };
  }

  // Sort select
  var ssel = $("lib-sort-select");
  if(ssel) {
    ssel.onchange = function() {
      currentSort = ssel.value;
      renderLibraryList();
    };
  }

  function formatSize(b) {
    if(!b || b <= 0) return "0 B";
    if(b < 1024) return b + " B";
    if(b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
    return (b / (1024 * 1024)).toFixed(1) + " MB";
  }

  function renderLibraryList() {
    var cont = $("photon-library-container");
    var countEl = $("lib-count-lbl");
    if(!cont) return;

    var list = photonLibraryFiles.slice();

    // Category filter
    if(currentCat !== "all") {
      list = list.filter(function(f){ return f.category === currentCat; });
    }

    // Query filter
    if(currentQuery) {
      list = list.filter(function(f){ return (f.name && f.name.toLowerCase().includes(currentQuery)); });
    }

    // Sort
    list.sort(function(a, b) {
      if(currentSort === "oldest") return a.at - b.at;
      if(currentSort === "name_asc") return (a.name||"").localeCompare(b.name||"");
      if(currentSort === "name_desc") return (b.name||"").localeCompare(a.name||"");
      if(currentSort === "size_desc") return (b.size||0) - (a.size||0);
      if(currentSort === "size_asc") return (a.size||0) - (b.size||0);
      return b.at - a.at; // newest
    });

    // Update count
    var totalBytes = list.reduce(function(acc, x){ return acc + (x.size||0); }, 0);
    if(countEl) {
      countEl.textContent = list.length + " files · " + (totalBytes > 0 ? formatSize(totalBytes) : "—");
    }

    if(!list.length) {
      cont.innerHTML = '<div class="photon-empty-box-large">' +
        '<div class="photon-empty-icon-badge">' +
          '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>' +
        '</div>' +
        '<div class="photon-empty-title">Nothing stored yet</div>' +
        '<p class="photon-empty-desc">Upload a document or image, or generate something in the Studio — it lands here.</p>' +
      '</div>';
      return;
    }

    var itemsHtml = '<div class="photon-lib-grid">';
    list.forEach(function(f) {
      var ext = (f.name.split(".").pop() || "FILE").toUpperCase();
      var isImg = f.category === "images" && f.dataUrl;
      itemsHtml += '<div class="photon-lib-card">' +
        '<div class="photon-lib-card-preview">' +
          (isImg ? '<img src="' + f.dataUrl + '" alt="' + esc(f.name) + '" style="width:100%;height:100%;object-fit:cover;border-radius:6px"/>' :
                   '<div class="photon-file-ext-badge">' + ext + '</div>') +
        '</div>' +
        '<div class="photon-lib-card-info">' +
          '<div class="photon-lib-card-name" title="' + esc(f.name) + '">' + esc(f.name) + '</div>' +
          '<div class="photon-lib-card-meta">' + ext + ' · ' + formatSize(f.size) + ' · ' + formatPhotonRelativeTime(f.at) + '</div>' +
        '</div>' +
        '<div class="photon-lib-card-actions">' +
          '<button class="photon-hist-dots-btn" type="button" onclick="deletePhotonLibFile(&quot;' + esc(f.id) + '&quot;)" title="Delete file">🗑</button>' +
        '</div>' +
      '</div>';
    });
    itemsHtml += '</div>';
    cont.innerHTML = itemsHtml;
  }

  window.deletePhotonLibFile = function(id) {
    if(confirm("Are you sure you want to delete this file from your Library?")) {
      photonLibraryFiles = photonLibraryFiles.filter(function(x){ return x.id !== id; });
      savePhotonLibrary();
      renderLibraryList();
    }
  };

  renderLibraryList();
}
